# ---------- Overriding hydra default configs ----------
hydra:
  job:
    name: omnibind
  run:
    dir: ./outputs/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: null

# ---------- Default settings ----------
defaults:
  - _self_  # load this file first so that the config groups below override its placeholders
  - dataset: bindingdb
  - optimizer: radam

  # For hydra colorlog
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled


# ---------- Other configs ----------

#====
# Preprocessing
#====
preprocessing:
  save_memory: false  # if true, drop samples exceeding the limits below (not used in the paper)
  max_atom_len: 60
  max_aa_len: 4000


#====
# Model
#====
model:
  type: aa3di_gmf  # Model type: 'aa', '3di', 'aa3di', 'aa3di_caf', 'aa3di_gmf'
  atom_dim: 35
  hid_dim: 256

  encoder_aa:
    hid_dim: 256
    n_layers: 2
    n_head: 8
    dropout: 0.1

  encoder_sa:
    hid_dim: 256
    n_layers: 2
    n_head: 8
    dropout: 0.1

  decoder:
    hid_dim: 256
    n_layers: 5
    n_head: 8
    dropout: 0.1
    hid_dim_fc: 256

  cafb:
    n_head: 8

#====
# Dataset
#====
dataset:
  type: ???
  data_dir: ???
  threshold: 6.5

#====
# Training
#====
# Paper setting: 8 GPUs (Horovod) x batch 2 x 64 accumulation steps = effective batch 1,024.
# Under Horovod the learning rate is scaled by the number of GPUs (1e-4 x 8 = 8e-4).
# Mixed precision (AMP) is always used for training.
training:
  project_name: omnibind
  debug: false
  seed: 0  # weight-initialization seed (data split seeds are set in data/preprocessing/split_data.py)
  accumulate_grad_batches: 64
  device: cuda

  epochs: 100
  batch_size_train: 2
  batch_size_valid: 8
  pin_memory: true
  num_workers: 4
  cuda: true
  drop_last: true
  log_interval: 10
  use_adasum: false
  fp16_allreduce: true
  gradient_predivide_factor: 1.0
  decay_interval: 5
  lr_decay: 1.0

test:
  checkpoint_path: null
  batch_size: 8
  save_memory_chunks: false
  smiles: null
  aa: null
  sa: null
  name: null
  smiles_file: null
  fixed_smiles: null
  seq_pkl_path: null
  ss_pkl_path: null


#====
# Optimizer
#====
optimizer:
  type: ???
  lr_head: ${optimizer.lr}


#====
# Other essential configs
#====
out_dir: ./outputs
quiet: false
